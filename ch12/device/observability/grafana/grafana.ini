# ch12 local Grafana — loopback only, no anonymous, no signups
[paths]
data         = /Users/vivekkalyanarangan/Downloads/ch12/observability/grafana/data
logs         = /Users/vivekkalyanarangan/Downloads/ch12/observability/grafana/logs
plugins      = /Users/vivekkalyanarangan/Downloads/ch12/observability/grafana/plugins
provisioning = /Users/vivekkalyanarangan/Downloads/ch12/observability/grafana/provisioning

[server]
protocol   = http
http_addr  = 127.0.0.1
http_port  = 3000

[security]
admin_user      = admin
disable_gravatar = true
cookie_secure   = false
cookie_samesite = lax
strict_transport_security = false
content_security_policy = true

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false

[analytics]
reporting_enabled = false
check_for_updates = false
