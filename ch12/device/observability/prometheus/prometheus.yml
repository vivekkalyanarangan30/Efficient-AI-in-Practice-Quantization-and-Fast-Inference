# Local Prometheus for ch12 device session
global:
  scrape_interval:     5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    scheme: https
    static_configs:
      - targets: ['127.0.0.1:9091']
    basic_auth:
      username: ch12_device
      password_file: /Users/vivekkalyanarangan/Downloads/ch12/observability/secrets/push.password
    tls_config:
      ca_file: /Users/vivekkalyanarangan/Downloads/ch12/observability/tls/server.crt
      server_name: localhost
